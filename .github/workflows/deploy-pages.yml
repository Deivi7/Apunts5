name: Deploy GitHub Pages (Vue + legacy)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: study-hub/package-lock.json

      - name: Install
        working-directory: study-hub
        run: npm ci

      - name: Build Vue (base GitHub Pages)
        working-directory: study-hub
        env:
          VITE_BASE: /Apunts5/
        run: npm run build

      - name: Embed legacy portal under /legacy/
        working-directory: study-hub
        run: node scripts/prepare-pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: study-hub/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
