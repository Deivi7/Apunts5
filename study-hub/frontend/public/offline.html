<!DOCTYPE html>
<html lang="es">
  <head>

    <title>Sin conexión · Álvaro Study Hub</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 1.5rem;
      }
      .card {
        max-width: 420px;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 1.5rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.35rem; }
      p { color: #64748b; line-height: 1.5; }
      a {
        display: inline-block;
        margin-top: 0.75rem;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        font-weight: 800;
        padding: 0.6rem 1rem;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>📴 Sin conexión</h1>
      <p>
        No se ha podido cargar ese recurso. Si ya visitaste el portal, vuelve al inicio:
        el catálogo y los temas cacheados deberían seguir disponibles en modo local.
      </p>
      <a href="/">Volver al portal</a>
    </div>
